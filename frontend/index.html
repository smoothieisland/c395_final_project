<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VibeMe — Find your next place</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

<header class="site-header">
  <div class="site-header__inner">
    <h1 class="site-title">VibeMe</h1>
    <p class="site-tagline">
      Tell us where & what you want — we'll find 5 places that fit.
    </p>
  </div>
</header>

<!-- TABS -->
<div class="tab-switch">
  <button class="tab-btn active" id="tab-recommend">Recommend</button>
  <button class="tab-btn" id="tab-predict">Predict</button>
</div>

<main class="layout">

<!-- ===================== RECOMMEND ===================== -->
<aside class="panel panel--form" id="recommend-panel">

  <form id="search-form" class="search-form">

    <!-- LOCATION -->
    <fieldset class="form-section">
      <legend>Location</legend>

      <label class="field">
        <span>City</span>
        <input type="text" id="city" required />
      </label>

      <label class="field">
        <span>Zip</span>
        <input type="text" id="zip" required maxlength="5" />
      </label>
    </fieldset>

    <!-- FILTERS -->
    <fieldset class="form-section">
      <legend>Filters</legend>

      <label>Min Bedrooms <input type="number" id="min_bedrooms"></label>
      <label>Max Bedrooms <input type="number" id="max_bedrooms"></label>

      <label>Min Bathrooms <input type="number" id="min_bathrooms"></label>
      <label>Max Bathrooms <input type="number" id="max_bathrooms"></label>

      <label><input type="checkbox" id="require_cats_ok"> Cats allowed</label>
      <label><input type="checkbox" id="require_dogs_ok"> Dogs allowed</label>
    </fieldset>

    <!-- UNIT PREFERENCES -->
    <fieldset class="form-section">
      <legend>Unit Preferences</legend>

      <label>Bedrooms <input type="number" id="bedrooms"></label>
      <label>Bathrooms <input type="number" id="bathrooms"></label>
    </fieldset>

    <!-- NEIGHBORHOOD FEATURES -->
    <fieldset class="form-section">
      <legend>Neighborhood Preferences</legend>

      <label>Cafes nearby <input type="number" id="cafes_nearby"></label>
      <label>Minutes to cafe <input type="number" id="minutes_to_closest_cafe"></label>

      <label>Restaurants nearby <input type="number" id="restaurants_nearby"></label>
      <label>Minutes to restaurant <input type="number" id="minutes_to_closest_restaurant"></label>

      <label>Shops nearby <input type="number" id="shops_nearby"></label>

      <label>Parks nearby <input type="number" id="parks_nearby"></label>

      <label>Minutes to bus stop <input type="number" id="minutes_to_nearest_bus_stop"></label>
      <label>Minutes to T-station <input type="number" id="minutes_to_nearest_t_station"></label>

      <label>Minutes to drugstore <input type="number" id="minutes_to_closest_drugstore"></label>
      <label>Minutes to urgent care <input type="number" id="minutes_to_closest_urgent_care"></label>
    </fieldset>

    <button id="search-btn" type="submit">Find 5 matches</button>
    <p id="form-status"></p>

  </form>
</aside>

<!-- ===================== PREDICT ===================== -->
<aside class="panel panel--form hidden" id="predict-panel">

  <form id="predict-form">

    <fieldset class="form-section">
      <legend>Location</legend>

      <label>City <input type="text" id="p-city" required></label>
      <label>Zip <input type="text" id="p-zip" required maxlength="5"></label>
    </fieldset>

    <fieldset class="form-section">
      <legend>Unit Features</legend>

      <label>Bedrooms <input type="number" id="p-bedrooms" value="2"></label>
      <label>Bathrooms <input type="number" id="p-bathrooms" value="1"></label>

      <label><input type="checkbox" id="p-cats"> Cats allowed</label>
      <label><input type="checkbox" id="p-dogs"> Dogs allowed</label>

      <!-- ================= REQUIRED MODEL FEATURES ================= -->
      <label>Cafés nearby <input type="number" id="p_cafes_nearby" value="0"></label>
      <label>Minutes to closest cafe <input type="number" id="p_minutes_to_closest_cafe" value="0"></label>

      <label>Restaurants nearby <input type="number" id="p_restaurants_nearby" value="0"></label>
      <label>Minutes to closest restaurant <input type="number" id="p_minutes_to_closest_restaurant" value="0"></label>

      <label>Shops nearby <input type="number" id="p_shops_nearby" value="0"></label>
      <label>Parks nearby <input type="number" id="p_parks_nearby" value="0"></label>

      <label>Minutes to nearest bus stop <input type="number" id="p_minutes_to_nearest_bus_stop" value="0"></label>
      <label>Minutes to nearest T-station <input type="number" id="p_minutes_to_nearest_t_station" value="0"></label>

      <label>Minutes to closest drugstore <input type="number" id="p_minutes_to_closest_drugstore" value="0"></label>
      <label>Minutes to closest urgent care <input type="number" id="p_minutes_to_closest_urgent_care" value="0"></label>

    </fieldset>

    <button type="submit">Predict Price</button>
    <p id="predict-status"></p>
  </form>
</aside>

<!-- ===================== RESULTS ===================== -->
<section class="panel panel--results">

  <div id="results-empty">Results will appear here</div>
  <div id="results-loading" class="hidden">Loading...</div>
  <div id="results-error" class="hidden"></div>
  <div id="results-grid" class="results-grid hidden"></div>

</section>

</main>

<!-- MODAL -->
<div id="detail-modal" class="modal hidden">
  
  <!-- BACKDROP (click to close) -->
  <div class="modal__backdrop" data-close-modal></div>

  <!-- CONTENT (click should NOT close) -->
  <div class="modal__content">
    
    <!-- close button -->
    <button data-close-modal class="modal__close">×</button>

    <div id="modal-body"></div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
